name: Deploy frontend to Vercel

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  vercel-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel@28

      - name: Trigger Vercel deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then echo "Missing VERCEL_TOKEN"; exit 1; fi
          # Set env var VITE_API_URL via Vercel API then trigger a deploy
          echo "Updating Vercel environment variable VITE_API_URL to $BACKEND_URL"
          curl -s -X PATCH "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID/env" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            -d '[{"key":"VITE_API_URL","value":"'$BACKEND_URL'","target":["production"]}]' || true

          echo "Triggering Vercel deployment"
          vercel --token "$VERCEL_TOKEN" --confirm --prod
