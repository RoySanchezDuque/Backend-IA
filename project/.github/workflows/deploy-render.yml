name: Deploy backend to Render

on:
  push:
    branches: [ 'render/deploy-ready' ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trigger Render deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          if [ -z "$RENDER_API_KEY" ]; then echo "Missing RENDER_API_KEY"; exit 1; fi
          if [ -z "$RENDER_SERVICE_ID" ]; then echo "Missing RENDER_SERVICE_ID"; exit 1; fi

          echo "Triggering deploy for Render service $RENDER_SERVICE_ID"
          RESP=$(curl -s -X POST "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"clearCache":true}')
          echo "$RESP" > render-deploy-response.json
          echo "Render deploy response:"
          cat render-deploy-response.json

      - name: Show latest deploy status
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          DEPLOY_ID=$(jq -r '.id' render-deploy-response.json)
          if [ "$DEPLOY_ID" = "null" ] || [ -z "$DEPLOY_ID" ]; then echo "No deploy id found"; exit 0; fi
          echo "Polling deploy status for $DEPLOY_ID"
          for i in 1 2 3 4 5; do
            sleep 5
            STATUS=$(curl -s -H "Authorization: Bearer $RENDER_API_KEY" "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys/$DEPLOY_ID" | jq -r '.status')
            echo "Status: $STATUS"
            if [ "$STATUS" = "succeeded" ] || [ "$STATUS" = "failed" ]; then break; fi
          done
